<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixas</title>
    <style>
        /* Box level */
        
        

        h1 {
            background-color: #706e6e;
            height: 300px;
            width: 300px;

            border: 10px, solid, #a19e9e;

            padding: 10px, 10px, 10px, 10px;

            margin: 10px auto 40px auto;

            outline: 10px dashed #8f0a0a;

        }

        /* Inline level */
        a {
            border-width: 10px;
            border-style: solid;
            border-color: #8f0a0a;

        }
    </style>


</head>

<body>
    <h1>Exemplos de caixa box-level</h1>
    <p>Parágrafos também são exemplos de caixas box-level, <a href="#"> mas os links são exemplos de caixas inline</a>.
        <br> Vamos ver como tudo isso funciona.
    </p>
</body>

</html>
