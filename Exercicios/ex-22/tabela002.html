<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 600px;
            border-collapse: collapse;
        }

        td,
        th {
            border: 1px solid black;
            padding: 10px;
        }

        caption {
            font-size: 2em;
            font-weight: bold;
            padding: 10px;
            background-color: blanchedalmond;
        }

        thead {
            background-color: bisque;
        }

        .num {
            text-align: right;
        }
    </style>
</head>

<body>
    <h1>Tabelas Grandes</h1>
    <!--Anatomia para tabelas Grandes 
    Caption
    thead
    tr,td,th
    tbody
    tr,td,th
    tfoot
    tr,td,th
    -->
    <table>
        <caption>Caption usado no titulo/legenda</caption>
        <thead>
            <th scope="col">Estado</th>
            <th scope="col">Populção</th>
        </thead>

        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45.919.049</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21.168.791</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17.264.943</td>
            </tr>
            <tr>
                <td>São Paulo</td>
                <td class="num">45.919.049</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21.168.791</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17.264.943</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <th scope="row">Total de habitantes</th>
                <td>0000</td>
            </tr>
        </tfoot>

    </table>


</body>

</html>
