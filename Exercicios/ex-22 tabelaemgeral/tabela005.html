<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Tabelas</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        col.cnome {
            background-color: rgb(173, 230, 216);
        }
    </style>
</head>

<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprofissao">
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>Feminino</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Claudio</td>
            <td>Masculino</td>
            <td>28</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Gustavo</td>
            <td>Masculino</td>
            <td>2</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Hélio </td>
            <td>Masculino</td>
            <td>30</td>
            <td>Advogada</td>
        </tr>
        <tr>
            <td>Júlia</td>
            <td>Feminino</td>
            <td>25</td>
            <td>Enfermeira</td>
        </tr>
        <tr>
            <td>Marcos</td>
            <td>Masculino</td>
            <td>35</td>
            <td>Engenheiro</td>
        </tr>
    </table>

</body>

</html>
