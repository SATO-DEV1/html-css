<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
</head>

<body>
    <h1>Testando Iframes</h1>
    <!-- Tamanho padrão de um iframe é 300px de largura e 150px de altura -->


    <p>Acessando o site do
        <iframe src="https://www.cursoemvideo.com" title="Site do Curso em Vídeo" width="300" height="150">
        </iframe>
        <a href="https://www.cursoemvideo.com" target="_blank" rel="noopener">Curso em Vídeo</a>
        para aprender a
        programar em HTML e CSS.
    </p>
    <p>Repositório:
        <iframe src="https://gustavoguanabara.github.io" title="GitHub - Professor Gustavo Guanabara" width="300"
            height="150"> </iframe>

        <a href="https://gustavoguanabara.github.io" target="_blank" rel="noopener">GitHub - Professor
            Gustavo Guanabara</a>

    </p>

</body>

</html>
